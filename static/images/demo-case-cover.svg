<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RW Case Study</title>
  <desc id="desc">深灰背景上的案例卡片图形</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18181b"/>
      <stop offset="1" stop-color="#52525b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <g transform="translate(90 108)" fill="none" stroke="#d4d4d8" stroke-width="6">
    <rect width="270" height="180" rx="22"/>
    <rect x="330" y="54" width="270" height="180" rx="22"/>
    <rect x="660" y="108" width="270" height="180" rx="22"/>
  </g>
  <text x="92" y="520" fill="#fff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="78" font-weight="700">Case Study</text>
  <text x="810" y="520" fill="#d4d4d8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36">RW Docs</text>
